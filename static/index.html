:root{--bg:#0b0c0f;--bg2:#131418;--bg3:#1a1c21;--border:#26282e;--text:#e9eaed;--muted:#8b8d96;--dim:#54565f;--cyan:#5b7cfa;--blue:#5b7cfa;--purple:#9376ff;--pink:#ec6a9a;--amber:#e2983b;--red:#f0576a;--green:#34c777}

body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;height:100vh;display:flex;flex-direction:column}

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ══ API helpers ══════════════════════════════════════════════════════════════ */
const api = {
  post: async (url, body) => {
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!r.ok) { const e = await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail || r.statusText); }
    return r.json();
  },
  get: async (url) => {
    const r = await fetch(url);
    if (!r.ok) { const e = await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail || r.statusText); }
    return r.json();
  },
};

/* ══ NODE TYPES for graph ═══════════════════════════════════════════════════ */
const NODE_TYPES = {
  person:   {color:"#06d6a0", icon:"👤"},
  company:  {color:"#8b5cf6", icon:"🏢"},
  email:    {color:"#ec4899", icon:"📧"},
  social:   {color:"#f59e0b", icon:"🌐"},
  location: {color:"#22c55e", icon:"📍"},
  ip:       {color:"#ef4444", icon:"🖥️"},
  username: {color:"#3b82f6", icon:"🔑"},
  alias:    {color:"#a855f7", icon:"🎭"},
  domain:   {color:"#22d3ee", icon:"🌍"},
};

/* ══ Construit un graphe à partir des vraies données /api/analyze ═══════════ */
function buildRealGraph(query, queryType, results) {
  if (!results || !Object.keys(results).length) return null;
  const rootType = queryType==="email"?"email":queryType==="ip"?"ip":queryType==="domain"?"domain":"person";
  const nodes = [{id:"root", label:query, type:rootType, detail:"Cible analysée"}];
  const edges = [];
  const seen = new Set(["root"]);
  const add = (id, label, type, detail, edgeLabel) => {
    if (!label || seen.has(id)) return;
    seen.add(id);
    nodes.push({id, label:String(label).slice(0,40), type, detail});
    edges.push({source:"root", target:id, label:edgeLabel});
  };

  (results.annuaire?.results||[]).slice(0,5).forEach((e,i)=>
    add(`ent_${e.siren||i}`, e.nom_complet||e.nom_raison_sociale, "company", e.siege?.libelle_commune||"", "lié à"));

  (results.pappers?.resultats||[]).slice(0,5).forEach((e,i)=>
    add(`pap_${e.siren||i}`, e.nom_entreprise||e.denomination, "company", e.siege?.ville||"", "lié à"));

  (results.bodacc?.results||[]).slice(0,5).forEach((a,i)=>{
    let nature = "Procédure collective";
    try { nature = JSON.parse(a.jugement||"{}").nature || nature; } catch {}
    add(`bodacc_${a.id||i}`, a.commercant, "company", nature, "⚠ procédure collective");
  });

  (results.opensanctions?.results||[]).slice(0,5).forEach((r,i)=>
    add(`sanc_${r.id||i}`, r.caption||r.properties?.name?.[0], "alias", "Liste de sanctions / PEP", "⚠ sanction/PEP"));

  if (results.hibp && !results.hibp.clean) {
    (results.hibp.breaches||[]).slice(0,8).forEach((b,i)=>
      add(`breach_${b.Name||i}`, b.Title||b.Name, "alias", b.BreachDate?`Fuite de données (${b.BreachDate})`:"Fuite de données", "🚨 fuite de données"));
  }

  (results.urlscan?.results||[]).slice(0,5).forEach((u,i)=>
    add(`scan_${u.task?.uuid||i}`, u.page?.domain||u.task?.domain, "domain", u.page?.country||"", "activité observée"));

  // crt.sh : sous-domaines vus dans des certificats SSL
  if (Array.isArray(results.crtsh)) {
    const subs = new Set();
    results.crtsh.forEach(c=>(c.name_value||"").split("\n").forEach(n=>subs.add(n.trim())));
    [...subs].filter(s=>s && s!==query).slice(0,8).forEach((s,i)=>
      add(`crt_${i}`, s, "domain", "Sous-domaine (crt.sh)", "sous-domaine"));
  }

  // RDAP : organisation enregistrante
  const rdapEntity = results.rdap?.entities?.find(e=>e.roles?.includes("registrant"))
                   || results.rdap?.entities?.find(e=>e.vcardArray);
  const rdapName = rdapEntity?.vcardArray?.[1]?.find(v=>v[0]==="fn")?.[3];
  if (rdapName) add("rdap_org", rdapName, "company", "Titulaire du nom de domaine (RDAP)", "enregistré par");

  const stats = results.virustotal?.data?.attributes?.last_analysis_stats;
  if (stats && (stats.malicious>0 || stats.suspicious>0))
    add("vt", `${stats.malicious||0} détections malveillantes`, "ip", "VirusTotal", "⚠ détection malware");

  if (results.abuseipdb?.data?.abuseConfidenceScore>0)
    add("abuseipdb", `Score abus : ${results.abuseipdb.data.abuseConfidenceScore}%`, "ip", results.abuseipdb.data.countryName||"", "⚠ signalements abus");

  if (results.otx?.pulse_info?.count>0)
    add("otx", `${results.otx.pulse_info.count} pulses OTX`, "ip", "Indicateurs de menace", "⚠ threat intel");

  if (results.greynoise?.noise)
    add("greynoise", `Scan internet (${results.greynoise.classification||'inconnu'})`, "ip", "GreyNoise", "⚠ activité de scan");

  (results.opencorporates?.results?.companies||[]).slice(0,5).forEach((c,i)=>
    add(`oc_${i}`, c.company?.name, "company", c.company?.jurisdiction_code||"", "lié à (OpenCorporates)"));

  const matches = results.shodan?.data || results.shodan?.matches;
  (matches||[]).slice(0,5).forEach((h,i)=>
    add(`shodan_${i}`, `${h.ip_str||query}:${h.port||"?"}`, "ip", h.product||"Service exposé", "port ouvert"));

  return nodes.length>1 ? {nodes, edges} : null;
}

/* ══ STYLES partagés ════════════════════════════════════════════════════════ */

/* ══ D3 Graph ═══════════════════════════════════════════════════════════════ */
function GraphView({data}) {
  const ref = useRef(null);
  const [sel, setSel] = useState(null);
  useEffect(()=>{
    if(!data?.nodes||!ref.current||typeof d3==='undefined') return;
    const el=ref.current, W=el.clientWidth||800, H=460;
    d3.select(el).selectAll("*").remove();
    const svg=d3.select(el).attr("viewBox",`0 0 ${W} ${H}`).style("background","var(--bg)");
    const defs=svg.append("defs");
    defs.append("marker").attr("id","a").attr("viewBox","0 -5 10 10").attr("refX",22).attr("refY",0).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
        .append("path").attr("d","M0,-5L10,0L0,5").attr("fill","#54565f");
    const g=svg.append("g");
    svg.call(d3.zoom().scaleExtent([.3,3]).on("zoom",e=>g.attr("transform",e.transform)));
    const nodes=data.nodes.map(n=>({...n}));
    const edges=data.edges.map(e=>({...e}));
    const sim=d3.forceSimulation(nodes)
      .force("link",d3.forceLink(edges).id(d=>d.id).distance(100))
      .force("charge",d3.forceManyBody().strength(-280))
      .force("center",d3.forceCenter(W/2,H/2))
      .force("coll",d3.forceCollide(38));
    const link=g.append("g").selectAll("line").data(edges).enter().append("line").attr("stroke","#26282e").attr("stroke-width",1.5).attr("marker-end","url(#a)");
    const lbl=g.append("g").selectAll("text").data(edges).enter().append("text").attr("font-size",8).attr("fill","#54565f").attr("text-anchor","middle").text(d=>d.label||"");
    const node=g.append("g").selectAll("g").data(nodes).enter().append("g").style("cursor","pointer")
      .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;}).on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
      .on("click",(e,d)=>{e.stopPropagation();setSel(d);});
    node.append("circle").attr("r",d=>d.type==="person"?20:15)
      .attr("fill",d=>(NODE_TYPES[d.type]||NODE_TYPES.person).color+"28")
      .attr("stroke",d=>(NODE_TYPES[d.type]||NODE_TYPES.person).color).attr("stroke-width",2);
    node.append("text").attr("text-anchor","middle").attr("dominant-baseline","central").attr("font-size",d=>d.type==="person"?14:11).text(d=>(NODE_TYPES[d.type]||NODE_TYPES.person).icon);
    node.append("text").attr("y",d=>d.type==="person"?28:22).attr("text-anchor","middle").attr("font-size",9).attr("fill","#c9d1d9").text(d=>d.label.length>16?d.label.slice(0,14)+"…":d.label);
    sim.on("tick",()=>{
      link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      lbl.attr("x",d=>(d.source.x+d.target.x)/2).attr("y",d=>(d.source.y+d.target.y)/2-4);
      node.attr("transform",d=>`translate(${d.x},${d.y})`);
    });
    svg.on("click",()=>setSel(null));
    return ()=>sim.stop();
  },[data]);
  return (
    <div style={{position:"relative"}}>
      <svg ref={ref} style={{width:"100%",height:460,borderRadius:10,border:"1px solid var(--border)",display:"block"}}/>
      {sel&&(
        <div style={{position:"absolute",top:10,right:10,background:"var(--bg2)",border:`1px solid ${(NODE_TYPES[sel.type]||NODE_TYPES.person).color}`,borderRadius:10,padding:14,minWidth:180}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:20}}>{(NODE_TYPES[sel.type]||NODE_TYPES.person).icon}</span>
            <button onClick={()=>setSel(null)} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer"}}>✕</button>
          </div>
          <div style={{fontSize:13,fontWeight:700,color:(NODE_TYPES[sel.type]||NODE_TYPES.person).color,marginBottom:3}}>{sel.label}</div>
          {sel.detail&&<div style={{fontSize:11,color:"var(--muted)"}}>{sel.detail}</div>}
        </div>
      )}
      <div style={{textAlign:"center",fontSize:10,color:"var(--dim)",marginTop:6}}>🖱 Clic • Drag • Scroll pour zoomer</div>
    </div>
  );
}

/* ══ ScoreBar ════════════════════════════════════════════════════════════════ */
function ScoreBar({score}) {
  const col = score<30?"var(--green)":score<60?"var(--amber)":"var(--red)";
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:10,color:"var(--muted)"}}>Score de risque</span>
        <span style={{fontSize:16,fontWeight:800,color:col,fontFamily:"'IBM Plex Mono',monospace"}}>{score}<span style={{fontSize:10,color:"var(--muted)"}}>/100</span></span>
      </div>
      <div style={{height:7,background:"var(--border)",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${score}%`,background:col,borderRadius:4,transition:"width .8s ease"}}/>
      </div>
    </div>
  );
}

/* ══ Dork link ═══════════════════════════════════════════════════════════════ */
function Dork({d}) {
  return (
    <a href={d.url} target="_blank" rel="noopener"
      style={{display:"block",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:6,padding:"9px 12px",marginBottom:5,transition:"border-color .15s"}}
      onMouseEnter={e=>e.currentTarget.style.borderColor="var(--blue)"}
      onMouseLeave={e=>e.currentTarget.style.borderColor="var(--border)"}>
      <div style={{fontSize:11,color:"var(--blue)",marginBottom:2}}>↗ {d.purpose||d.name}</div>
      <div style={{fontSize:10,color:"var(--dim)",fontFamily:"'IBM Plex Mono',monospace",wordBreak:"break-all"}}>{d.query||d.url}</div>
    </a>
  );
}

/* ══ API Results panel ════════════════════════════════════════════════════════ */
/* ══ Synthèse lisible par source ══════════════════════════════════════════════ */
function summarizeSource(key, v) {
  try {
    switch (key) {
      case 'annuaire': {
        const r = v.results || [];
        if (!r.length) return "Aucune entreprise trouvée dans l'Annuaire des Entreprises.";
        const f = r[0];
        return `${r.length} entreprise${r.length>1?'s':''} trouvée${r.length>1?'s':''} — ex : ${f.nom_complet||f.nom_raison_sociale} (SIREN ${f.siren}, ${f.siege?.libelle_commune||'?'}).`;
      }
      case 'pappers': {
        const r = v.resultats || [];
        if (!r.length) return "Aucune entreprise trouvée sur Pappers.";
        const f = r[0];
        return `${r.length} résultat${r.length>1?'s':''} — ex : ${f.nom_entreprise||f.denomination} (SIREN ${f.siren}).`;
      }
      case 'bodacc': {
        const r = v.results || [];
        if (!r.length) return "Aucune annonce BODACC — pas de procédure collective récente.";
        let nature = "procédure collective";
        try { nature = JSON.parse(r[0].jugement||"{}").nature || nature; } catch {}
        return `${r.length} annonce${r.length>1?'s':''} — ex : ${r[0].commercant} (${nature}, ${r[0].dateparution}).`;
      }
      case 'opensanctions': {
        const r = v.results || [];
        return r.length ? `⚠ ${r.length} correspondance${r.length>1?'s':''} potentielle${r.length>1?'s':''} sur des listes de sanctions/PEP — à vérifier.` : "Aucune correspondance sur les listes de sanctions/PEP.";
      }
      case 'hibp': {
        if (v.clean) return "Aucune fuite de données connue pour cet email.";
        const n = (v.breaches||[]).length;
        return `⚠ ${n} fuite${n>1?'s':''} de données trouvée${n>1?'s':''}${n?` — ex : ${v.breaches[0].Title||v.breaches[0].Name}`:''}.`;
      }
      case 'hunter': {
        const d = v.data || v;
        return `Email : ${d?.status||'statut inconnu'}${d?.score!=null?` (confiance ${d.score}/100)`:''}.`;
      }
      case 'urlscan': {
        const r = v.results || [];
        if (!r.length) return "Aucun scan trouvé sur URLScan.io.";
        const total = v.total || r.length;
        return `${total} scan${total>1?'s':''} référencé${total>1?'s':''} — ex : ${r[0].page?.domain||r[0].task?.domain||''}.`;
      }
      case 'virustotal': {
        const stats = v.data?.attributes?.last_analysis_stats;
        if (!stats) return "Pas de données VirusTotal exploitables.";
        const bad = (stats.malicious||0)+(stats.suspicious||0);
        return bad>0 ? `⚠ ${bad} moteur(s) antivirus signalent cette cible.` : "Aucune détection malveillante sur VirusTotal.";
      }
      case 'ipinfo': return `${v.city||'?'}, ${v.country||'?'} — ${v.org||'fournisseur inconnu'}.`;
      case 'ipapi': return v.status==='success' ? `${v.city||'?'}, ${v.country||'?'} — ${v.isp||v.org||'fournisseur inconnu'}.` : "Géolocalisation indisponible.";
      case 'abuseipdb': {
        const d = v.data;
        if (!d) return "Pas de données AbuseIPDB.";
        return d.abuseConfidenceScore>0 ? `⚠ Score d'abus : ${d.abuseConfidenceScore}% (${d.totalReports||0} signalement(s)).` : "Aucun signalement d'abus sur cette IP.";
      }
      case 'shodan': {
        const m = v.data || v.matches || [];
        if (!m.length) return "Aucun service exposé détecté par Shodan.";
        return `${m.length} service${m.length>1?'s':''} exposé${m.length>1?'s':''} — ex : port ${m[0].port}${m[0].product?`, ${m[0].product}`:''}.`;
      }
      case 'otx': {
        const n = v.pulse_info?.count || 0;
        return n>0 ? `⚠ Référencé dans ${n} pulse(s) de threat intelligence.` : "Aucun indicateur de menace référencé.";
      }
      case 'crtsh': {
        if (!Array.isArray(v) || !v.length) return "Aucun certificat SSL trouvé.";
        const subs = new Set();
        v.forEach(c=>(c.name_value||"").split("\n").forEach(n=>subs.add(n.trim())));
        return `${subs.size} sous-domaine${subs.size>1?'s':''} unique${subs.size>1?'s':''} détecté${subs.size>1?'s':''} via les certificats SSL.`;
      }
      case 'rdap': {
        const status = (v.status||[]).join(", ");
        return `Domaine enregistré${v.ldhName?` (${v.ldhName})`:''}${status?` — statut : ${status}`:''}.`;
      }
      case 'wayback': {
        if (!Array.isArray(v) || v.length<2) return "Aucune archive trouvée sur Wayback Machine.";
        return `${v.length-1} capture${v.length-1>1?'s':''} archivée${v.length-1>1?'s':''} trouvée${v.length-1>1?'s':''}.`;
      }
      case 'greynoise': {
        if (v.noise) return `⚠ IP détectée en activité de scan internet (classification : ${v.classification||'inconnue'}).`;
        if (v.riot) return "IP associée à un service connu référencé (RIOT) — faible risque.";
        return "Aucune activité de scan détectée pour cette IP (GreyNoise).";
      }
      case 'opencorporates': {
        const companies = v.results?.companies || [];
        if (!companies.length) return "Aucune société trouvée sur OpenCorporates.";
        const c = companies[0].company || {};
        return `${companies.length} société(s) trouvée(s) — ex : ${c.name} (${c.jurisdiction_code||'?'}).`;
      }
      default: return "Résultat reçu.";
    }
  } catch { return "Résultat reçu."; }
}

function friendlyError(err) {
  const s = String(err||"");
  if (s.includes("401")) return "Ce service nécessite une clé API non configurée pour l'instant.";
  if (s.includes("429")) return "Limite de requêtes atteinte pour ce service — réessayez plus tard.";
  if (/timeout/i.test(s)) return "Ce service n'a pas répondu à temps.";
  return "Ce service est temporairement indisponible.";
}

function ApiResultsPanel({results, queryType, loading, premium, onUpgrade}) {
  const [open, setOpen] = useState({});
  const toggle = k => setOpen(p=>({...p,[k]:!p[k]}));

  if (loading) return (
    <div style={{display:"flex",alignItems:"center",gap:10,padding:14,background:"var(--bg)",borderRadius:8,border:"1px solid var(--border)"}}>
      <span className="spin">⟳</span>
      <span style={{fontSize:12,color:"var(--cyan)"}}>Interrogation des APIs en cours…</span>
    </div>
  );
  if (!results || !Object.keys(results).length) return null;

  const labels = {
    annuaire:"🇫🇷 Annuaire Entreprises",bodacc:"⚖️ BODACC",opensanctions:"🚫 OpenSanctions",
    pappers:"🏢 Pappers",hibp:"📧 Have I Been Pwned",hunter:"🎯 Hunter.io",
    urlscan:"🔍 URLScan.io",virustotal:"🦠 VirusTotal",ipinfo:"🌍 IPInfo",

              {hasError ? friendlyError(v.error) : summarizeSource(k, v)}

            {isOpen && (
              <div style={{padding:"0 14px 14px"}}>
                {hasError ? (
                  <div style={{fontSize:10,color:"var(--dim)",fontFamily:"'IBM Plex Mono',monospace"}}>{v.error}</div>

                  <pre style={{fontSize:10,color:"var(--muted)",overflow:"auto",maxHeight:240,background:"var(--bg2)",padding:10,borderRadius:6,whiteSpace:"pre-wrap",wordBreak:"break-all"}}>
                    {JSON.stringify(v, null, 2).slice(0, 2000)}{JSON.stringify(v).length>2000?"…":""}
                  </pre>
                ) : (
                  <div style={{textAlign:"center",padding:16,background:"rgba(245,158,11,.06)",border:"1px solid rgba(245,158,11,.25)",borderRadius:8}}>
                    <div style={{fontSize:11,color:"var(--amber)",marginBottom:8}}>🔒 Données brutes complètes — fonctionnalité Premium</div>
                    <button onClick={onUpgrade} style={S.btn("var(--green)")}>💳 Voir les formules</button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function App() {
  const [screen, setScreen]           = useState("landing");
  const [menuOpen, setMenuOpen]       = useState(false);
  const [mode, setMode]               = useState(null);
  const [query, setQuery]             = useState("");

  const [report, setReport]           = useState(null);
  const [loading, setLoading]         = useState(false);
  const [loadMsg, setLoadMsg]         = useState("");
  const [reportTab, setReportTab]     = useState("rapport");
  const [apiResults, setApiResults]   = useState(null);
  const [apiLoading, setApiLoading]   = useState(false);
  const [apiQType, setApiQType]       = useState("");
  const [config, setConfig]           = useState({});
  const [history, setHistory]         = useState([]);
  const [cases, setCases]             = useState([]);
  const [activeCase, setActiveCase]   = useState(null);
  const [newCaseName, setNewCaseName] = useState("");
  const [checks, setChecks]           = useState([]);
  const [batchTargets, setBatchTargets] = useState("");
  const [batchMode, setBatchMode]     = useState("investigation");
  const [batchResults, setBatchResults] = useState([]);
  const [batchRunning, setBatchRunning] = useState(false);
  const [usernameInput, setUsernameInput] = useState("");
  const [usernameRes, setUsernameRes] = useState(null);
  const [usernameLoading, setUsernameLoading] = useState(false);
  const [showNotFound, setShowNotFound] = useState(false);
  const [shareCopied, setShareCopied] = useState(false);
  const [pdfLoading, setPdfLoading]   = useState(false);
  const [waitlistEmail, setWaitlistEmail] = useState("");
  const [waitlistStatus, setWaitlistStatus] = useState(null); // null | "loading" | "done" | "error"

  const mc = mode?.color || "var(--cyan)";

  // Load config + history + cases on mount
  useEffect(()=>{
    api.get("/api/config").then(setConfig).catch(()=>{});
    api.get("/api/history").then(setHistory).catch(()=>{});
    api.get("/api/cases").then(setCases).catch(()=>{});
  },[]);

  const refreshHistory = () => api.get("/api/history").then(setHistory).catch(()=>{});
  const refreshCases   = () => api.get("/api/cases").then(setCases).catch(()=>{});

  const reset = () => {
    setScreen("home"); setMode(null); setQuery(""); setCtx("");
    setReport(null); setApiResults(null); setReportTab("rapport");
  };
  const goLanding = () => { setScreen("landing"); setMode(null); setQuery(""); setCtx(""); setReport(null); setApiResults(null); };

  // Generate report
  const generate = async () => {
    if (!query.trim()) return;
    setLoading(true); setReport(null); setApiResults(null);
    setScreen("loading"); setLoadMsg("Analyse en cours…");

    // Les données réelles (APIs publiques) sont toujours récupérées,
    // même si le rapport IA échoue ou n'est pas configuré (pas de clé GROQ_API_KEY).
    setApiLoading(true);
    api.get(`/api/analyze?q=${encodeURIComponent(query)}`)
      .then(d=>{ setApiResults(d.results); setApiQType(d.query_type); setApiLoading(false); })
      .catch(()=>setApiLoading(false));

    try {
      const r = await api.post("/api/report", {query, mode: mode.id, ctx});
      if (r.checklist) setChecks(r.checklist.map(()=>false));
      setReport(r); setReportTab("rapport");
      refreshHistory();
    } catch(e) {
      setReport({error:true, errorMsg:e.message, target:query});
      setReportTab("realdata");
    }
    setScreen("report");
    setLoading(false);
  };

  // Batch
  const runBatch = async () => {
    const targets = batchTargets.split('\n').map(l=>l.trim()).filter(Boolean).slice(0,10);
    if (!targets.length) return;
    setBatchRunning(true);
    setBatchResults(targets.map(t=>({query:t, status:"loading"})));
    try {
      const res = await api.post("/api/batch", {targets, mode: batchMode});
      setBatchResults(res.results || []);
      refreshHistory();
    } catch(e) {
      setBatchResults(targets.map(t=>({query:t, status:"error", error:e.message})));
    }
    setBatchRunning(false);
  };

  // Username
  const runUsername = async () => {
    if (!usernameInput.trim()) return;
    setUsernameLoading(true); setUsernameRes(null); setShowNotFound(false);
    try {
      const r = await api.post("/api/username", {username: usernameInput.trim()});
      setUsernameRes(r);
    } catch(e) { setUsernameRes({error: e.message}); }
    setUsernameLoading(false);
  };

  const joinWaitlist = async () => {
    if (!waitlistEmail.trim()) return;
    setWaitlistStatus("loading");
    try {
      await api.post("/api/waitlist", {email: waitlistEmail.trim()});
      setWaitlistStatus("done");
    } catch(e) { setWaitlistStatus("error"); }
  };

  // PDF
  const exportPDF = async () => {
    if (!report || report.error) return;
    setPdfLoading(true);
    try {
      const r = await fetch("/api/export/pdf", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({report, mode_label: mode?.label||"Investigation"})
      });
      if (!r.ok) throw new Error(await r.text());
      const blob = await r.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = `osint-${(report.target||"rapport").replace(/\s+/g,"-")}.pdf`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);

    setPdfLoading(false);

                {name:"Societe.com",url:"https://societe.com",desc:"Données entreprises"},
                {name:"OpenCorporates",url:"https://opencorporates.com",desc:"International"},

</script>
